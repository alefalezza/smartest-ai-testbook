schema: spec-driven

context: |
  Questo progetto è un esercizio scolastico di programmazione a oggetti.
  Ogni classe deve dichiarare e implementare esplicitamente una o più interfacce
  TypeScript che ne rendano visibile il contratto pubblico, anche quando esiste
  una sola implementazione.
  Le classi del dominio Python dichiarano e implementano esplicitamente uno o
  più contratti pubblici tramite Protocol, anche con una sola implementazione.
  Le specifiche sono condivise; i task distinguono implementazione e verifica
  TypeScript e Python, rendendo esplicite eventuali differenze di avanzamento.

