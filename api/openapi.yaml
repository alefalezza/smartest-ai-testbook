openapi: 3.0.3
info:
  title: Smartest AI Testbook API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check server connectivity
      responses:
        '200':
          description: The server is responding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      additionalProperties: false
